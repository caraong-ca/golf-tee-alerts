name: Golf Tee Time Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # REQUIRED to commit state.json

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests twilio

      - name: Run tee time monitor
        env:
          PLAYERS: "ANY"
          COURSE_IDS: "1,2,3"

          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO }}

        run: python check_teetimes.py

      - name: Commit updated state (dedupe memory)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update tee time state [skip ci]"
            git push
          fi
